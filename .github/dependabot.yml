version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6

    # Keep low-risk dependency updates together, but keep build tooling isolated.
    groups:
      kotlin-toolchain:
        applies-to: version-updates
        patterns:
          - "org.jetbrains.kotlin.android"
          - "org.jetbrains.kotlin.plugin.compose"
        update-types:
          - "minor"
          - "patch"

      android-libraries:
        applies-to: version-updates
        patterns:
          - "androidx.*"
          - "org.jetbrains.kotlinx:*"
        exclude-patterns:
          - "androidx.compose:compose-bom"
        update-types:
          - "minor"
          - "patch"

    # AGP and Gradle have a strict compatibility matrix. Patch updates within
    # the current AGP line are safe for automation; minor/major upgrades are
    # handled manually together with the matching Gradle version and migrations.
    ignore:
      - dependency-name: "com.android.application"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # Compose 1.12+ requires compileSdk 37 and AGP 9.1.2+, so keep
      # calendar-major BOM upgrades tied to the deliberate AGP migration.
      - dependency-name: "androidx.compose:compose-bom"
        update-types:
          - "version-update:semver-major"

      # CodeQL 2.27.0 cannot instrument Kotlin 2.4.20 yet. Keep the
      # supported 2.4.10 toolchain until CodeQL adds 2.4.20 support.
      - dependency-name: "org.jetbrains.kotlin.android"
        versions:
          - "2.4.20"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions:
          - "2.4.20"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
