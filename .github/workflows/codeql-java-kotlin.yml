name: CodeQL Java and Kotlin validation

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - id: gradle-version
        name: Read Gradle version
        run: echo "version=$(cat gradle/ci-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for CodeQL
        run: gradle --no-daemon :core:classes :app:assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
          upload: never
          output: codeql-results

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeql-java-kotlin-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
