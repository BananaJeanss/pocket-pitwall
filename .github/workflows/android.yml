name: Android build and checks

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - id: gradle-version
        name: Read Gradle version
        run: echo "version=$(cat gradle/ci-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and assemble
        run: gradle --no-daemon :core:check :protocol:test :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :wear:lintDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v7
        name: Upload phone debug APK
        with:
          name: pocket-pitwall-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        name: Upload wear debug APK
        with:
          name: pocket-pitwall-wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android navigation regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./scripts/test-android.sh
      - uses: actions/upload-artifact@v7
        if: always()
        name: Upload UI test results
        with:
          name: android-ui-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        name: Upload lint report
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-debug.html
            app/build/reports/tests/
            wear/build/reports/tests/
            protocol/build/reports/tests/
          if-no-files-found: ignore
  wear-ui:
    name: Wear OS UI (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [wearos_small_round, wearos_large_round]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - id: gradle-version
        name: Read Gradle version
        run: echo "version=$(cat gradle/ci-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}
      - name: Install Android SDK and compile watch tests
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :wear:assembleDebug :wear:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Round watch screenshot and interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: ./scripts/test-android.sh wear
      - uses: actions/upload-artifact@v7
        if: always()
        name: Upload watch screenshots and test results
        with:
          name: wear-ui-${{ matrix.profile }}
          path: |
            screenshots/wear/
            wear/build/reports/androidTests/
            wear/build/outputs/androidTest-results/
          if-no-files-found: error
